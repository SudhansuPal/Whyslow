[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whyslow"
version = "0.1.0"
description = "Why Is This Slow? A local, real-time system detective for macOS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Keep this list tiny: every entry is supply-chain surface. Exact pins live in requirements.txt.
dependencies = [
    "psutil==7.2.2",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
# The menu bar is optional: `pip install -e ".[menubar]"`.
menubar = ["rumps==0.4.0"]

[project.scripts]
whyslow = "whyslow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"whyslow.web" = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*"]
